version: '3.8'

services:
  # Backend Express REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news-aggregator-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
    restart: always

  # Frontend React Dashboard Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: news-aggregator-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend
    stdin_open: true
    tty: true
    restart: always
